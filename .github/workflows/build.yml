name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only the newest push to main needs to reach the `latest` release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # update the `latest` release

jobs:
  build:
    name: Test & build screensaver
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Run tests
        run: |
          xcodebuild -project MatrixDigitalRain.xcodeproj \
            -scheme MatrixDigitalRain \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY=- \
            test

      # Ad-hoc signed: no Apple developer account or certificates needed.
      - name: Build Release
        run: |
          xcodebuild -project MatrixDigitalRain.xcodeproj \
            -scheme MatrixDigitalRain \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM= \
            build
          codesign --verify --strict --verbose=2 build/Build/Products/Release/MatrixDigitalRain.saver

      # ditto keeps the bundle's permissions and signature intact
      # (upload-artifact alone drops the executable bit). The zip is then
      # uploaded as-is, so the download is a single, ready-to-unzip file.
      - name: Package
        run: ditto -c -k --keepParent build/Build/Products/Release/MatrixDigitalRain.saver MatrixDigitalRain.saver.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          path: MatrixDigitalRain.saver.zip
          archive: false
          if-no-files-found: error

      # Rolling pre-release with a permanent download URL:
      # https://github.com/<owner>/<repo>/releases/download/latest/MatrixDigitalRain.saver.zip
      - name: Publish to `latest` release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          notes="Automatic build of ${GITHUB_SHA::7} from \`main\`. Ad-hoc signed, not notarized: after unzipping, run \`xattr -dr com.apple.quarantine MatrixDigitalRain.saver\`."
          if gh release view latest >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/latest" -f sha="$GITHUB_SHA" -F force=true >/dev/null
            gh release edit latest --prerelease --title "Latest build" --notes "$notes"
          else
            gh release create latest --prerelease --target "$GITHUB_SHA" --title "Latest build" --notes "$notes"
          fi
          gh release upload latest MatrixDigitalRain.saver.zip --clobber
